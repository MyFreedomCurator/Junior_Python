
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовое приложение</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>📝 Отправка результатов</h1>
    <p>Введите данные и нажмите "Отправить" — они попадут в вашу Google Таблицу!</p>

    <form id="resultForm">
        <div class="form-group">
            <label for="name">Имя ученика:</label>
            <input type="text" id="name" placeholder="Например, Иванов Иван" required>
        </div>

        <div class="form-group">
            <label for="score">Результат (баллы):</label>
            <input type="number" id="score" placeholder="Например, 85" required>
        </div>

        <div class="form-group">
            <label for="answers">Краткий ответ (необязательно):</label>
            <textarea id="answers" rows="3" placeholder="Что-то еще..."></textarea>
        </div>

        <button type="submit">📤 Отправить результат</button>
    </form>

    <div id="status"></div>

    <script>
        // ⚠️ ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ ИЗ ШАГА 3!
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzVzs7EF61zbkiVMDY7ZH6FXAHVvU5hpfG8WYdu3BazwWaMxE2cN90qI2ZcpzWaljCO/exec';

        const form = document.getElementById('resultForm');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Собираем данные из формы
            const data = {
                name: document.getElementById('name').value.trim(),
                score: parseInt(document.getElementById('score').value) || 0,
                answers: document.getElementById('answers').value.trim() || 'Нет ответа'
            };

            // Показываем статус "отправка..."
            statusDiv.style.display = 'block';
            statusDiv.className = '';
            statusDiv.textContent = '⏳ Отправка данных...';

            try {
                // Отправляем POST-запрос на Google Apps Script
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Важно для отправки с GitHub Pages!
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                // При режиме 'no-cors' мы не можем прочитать ответ,
                // поэтому показываем успех, если нет ошибок
                statusDiv.className = 'success';
                statusDiv.textContent = '✅ Данные успешно отправлены! Проверьте Google Таблицу.';
                
                // Очищаем форму
                form.reset();

            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.textContent = '❌ Ошибка отправки: ' + error.message;
                console.error('Ошибка:', error);
            }
        });
    </script>
</body>
</html>
